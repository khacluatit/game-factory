# Build iOS trên máy macOS của GitHub (có Xcode 26) — không cần Mac đời mới.
# Chạy: tab Actions → "Ship game" → Run workflow → nhập tên game + lane.
name: Ship game

on:
  push:
    branches: [main]
    paths: ["Core/**", "Games/**", "Template/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      game:
        description: "Tên game trong Games/ (vd OrbitDodge)"
        required: true
        default: OrbitDodge
      lane:
        description: "check = chỉ biên dịch thử | screenshots | beta = TestFlight | all = TestFlight + metadata + ảnh"
        required: true
        default: check
        type: choice
        options: [check, screenshots, beta, metadata, all]

jobs:
  ship:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GAME: ${{ inputs.game || 'OrbitDodge' }}
      LANE: ${{ inputs.lane || 'check' }}
    steps:
      - uses: actions/checkout@v4

      - name: Chọn Xcode 26 mới nhất
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Cài công cụ
        run: |
          brew install xcodegen
          command -v fastlane || brew install fastlane

      - name: Tạo factory.env + API key từ Secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect
          if [ -n "$ASC_KEY_P8" ]; then echo "$ASC_KEY_P8" > ~/.appstoreconnect/AuthKey.p8; fi
          cat > factory.env <<ENV
          TEAM_ID="${{ secrets.TEAM_ID || 'H6772QYC2A' }}"
          BUNDLE_PREFIX="${{ vars.BUNDLE_PREFIX || 'com.beemob' }}"
          GITHUB_PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          SUPPORT_EMAIL="${{ vars.SUPPORT_EMAIL || 'bm.apple.publish@gmail.com' }}"
          ASC_KEY_ID="${{ secrets.ASC_KEY_ID }}"
          ASC_ISSUER_ID="${{ secrets.ASC_ISSUER_ID }}"
          ASC_KEY_PATH="$HOME/.appstoreconnect/AuthKey.p8"
          ENV
          chmod +x scripts/*.sh

      - name: Biên dịch thử (simulator, không ký)
        if: env.LANE == 'check'
        run: |
          scripts/gen.sh "${{ env.GAME }}"
          cd "Games/${{ env.GAME }}"
          xcodebuild -project "${{ env.GAME }}.xcodeproj" -scheme "${{ env.GAME }}" \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          # Đẩy lỗi thành annotation để đọc được từ Checks API
          grep -E "^/.*: error: " build.log | sed -E "s#^$GITHUB_WORKSPACE/##" | sort -u | head -40 | while IFS= read -r l; do
            f="${l%%:*}"; rest="${l#*:}"; ln="${rest%%:*}"; msg="${l#*error: }"
            echo "::error file=$f,line=$ln::$msg"
          done
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | tail -60
          grep -q "BUILD SUCCEEDED" build.log

      - name: Chụp screenshot
        if: env.LANE == 'screenshots' || env.LANE == 'metadata' || env.LANE == 'all'
        run: scripts/screenshots.sh "${{ env.GAME }}"

      - name: TestFlight (+ metadata)
        if: env.LANE == 'beta' || env.LANE == 'metadata' || env.LANE == 'all'
        run: |
          set -o pipefail
          if ! scripts/ship.sh "${{ env.GAME }}" "${{ env.LANE }}" 2>&1 | tee ship.log; then
            # Đẩy các dòng lỗi thành annotation (đọc được qua Checks API)
            grep -E "error:|\[!\]|❌|Error|failed|No profiles|signing|Signing|Provisioning|certificate" ship.log \
              | grep -v "^\* \[" | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            find "Games/${{ env.GAME }}/build/logs" -name "*.log" -exec sh -c 'grep -hE "error:|requires a provisioning|No Account|No signing" "$1" | sort -u | head -20 | while IFS= read -r l; do echo "::error::${l:0:900}"; done' _ {} \; 2>/dev/null || true
            # 50 dòng ngay trước lỗi đóng gói + log phân phối của Xcode
            awk '/Error packaging up|fastlane finished with errors/{exit} {print}' ship.log | tail -50 | grep -v "^\s*$" \
              | while IFS= read -r l; do echo "::warning::${l:0:900}"; done
            # Chạy lại bước export trực tiếp để thấy lỗi thật của Xcode
            ARC=$(ls -dt ~/Library/Developer/Xcode/Archives/*/*.xcarchive 2>/dev/null | head -1)
            if [ -n "$ARC" ]; then
              cat > /tmp/eo.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>signingStyle</key><string>automatic</string><key>teamID</key><string>H6772QYC2A</string></dict></plist>
          PL
              sed -i '' 's/^ *//' /tmp/eo.plist
              xcodebuild -exportArchive -archivePath "$ARC" -exportPath /tmp/exp -exportOptionsPlist /tmp/eo.plist \
                -allowProvisioningUpdates -authenticationKeyPath ~/.appstoreconnect/AuthKey.p8 \
                -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" > /tmp/exp.log 2>&1 || true
              grep -v "^\s*$" /tmp/exp.log | tail -30 | while IFS= read -r l; do echo "::error::EXPORT ${l:0:900}"; done
            fi
            for f in $(find "${TMPDIR:-/tmp}" /var/folders -name "IDEDistribution*.log" 2>/dev/null | head -5); do
              grep -iE "error|fail|denied|not permitted|certificate|profile|cloud" "$f" | sort -u | head -25 \
                | while IFS= read -r l; do echo "::error::DIST ${l:0:900}"; done
            done
            exit 1
          fi

      - name: Lưu log + screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME }}-${{ env.LANE }}
          path: |
            Games/${{ env.GAME }}/build.log
            Games/${{ env.GAME }}/screenshots/
            Games/${{ env.GAME }}/build/*.ipa
            Games/${{ env.GAME }}/build/logs/
            ship.log
          if-no-files-found: ignore
