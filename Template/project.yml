# XcodeGen spec — scripts/gen.sh nạp game.env + secrets.env rồi chạy `xcodegen`.
name: ${GAME_NAME}
options:
  bundleIdPrefix: ${BUNDLE_ID}
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  GameCore:
    path: ../../Core

targets:
  ${GAME_NAME}:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: GameCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        PRODUCT_NAME: ${GAME_NAME}
        MARKETING_VERSION: ${MARKETING_VERSION}
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ${TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_PREVIEWS: YES
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ${APP_DISPLAY_NAME}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarHidden: true
        GADApplicationIdentifier: ${ADMOB_APP_ID}
        NSUserTrackingUsageDescription: "Your data will be used to show you more relevant ads and keep this game free."
        GCInterstitialID: ${AD_INTERSTITIAL_ID}
        GCRewardedID: ${AD_REWARDED_ID}
        GCInterstitialEvery: ${INTERSTITIAL_EVERY}
        GCInterstitialGrace: ${INTERSTITIAL_GRACE}
        GCRemoveAdsProductID: ${IAP_REMOVE_ADS_ID}
        GCPrivacyURL: ${PRIVACY_URL}
        SKAdNetworkItems:
          # Google (bắt buộc) + các mạng mediation phổ biến
