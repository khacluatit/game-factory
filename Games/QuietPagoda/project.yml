# XcodeGen spec — app SwiftUI + WKWebView (cảnh 3D trong Web/), không dùng GameCore/AdMob.
name: ${GAME_NAME}
options:
  bundleIdPrefix: ${BUNDLE_ID}
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

targets:
  ${GAME_NAME}:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        PRODUCT_NAME: ${GAME_NAME}
        MARKETING_VERSION: ${MARKETING_VERSION}
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        DEVELOPMENT_TEAM: ${TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_PREVIEWS: YES
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ${APP_DISPLAY_NAME}
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, vi, zh-Hant]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBG
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarHidden: true
        QPPrivacyURL: ${PRIVACY_URL}
