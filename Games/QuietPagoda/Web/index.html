<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Quiet Pagoda</title>
<style>
:root {
  --ink: #F4EBDD; --ink-soft: #D8C8B2; --glass: rgba(20, 10, 8, 0.55); --gold: #D9A441; --wood: #2A1A12;
  --paper: #F4EBDD; --paper-2: #EADFCD; --brown: #3B2A24; --brown-soft: #6A5A50; --red: #7A2E1F; --line: rgba(244, 235, 221, 0.35);
  --font: -apple-system-ui-rounded, ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
html, body { margin: 0; height: 100%; background: #120806; color: var(--ink); font-family: var(--font); overflow: hidden; }
[hidden] { display: none !important; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font-family: var(--font); cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.top { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
.chip { background: var(--glass); border-radius: 18px; padding: 8px 14px; font-size: 15px; font-weight: 600; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.chip small { display: block; font-size: 12px; font-weight: 400; color: var(--ink-soft); }
.chip.serif { font-family: "New York", "Songti TC", Georgia, serif; }
.icons { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
.round { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--glass); display: flex; align-items: center; justify-content: center; color: var(--ink); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.round svg { width: 20px; height: 20px; }
.banner { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 70px); background: rgba(59,42,36,0.85); color: var(--ink); border-radius: 16px; padding: 7px 14px; font-size: 13px; font-weight: 600; white-space: nowrap; pointer-events: none; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: 42%; background: rgba(244,235,221,0.95); color: var(--brown); border-radius: 18px; padding: 12px 18px; font-size: 15px; font-weight: 700; text-align: center; max-width: 86%; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.toast .row { width: auto; }
.toast button { height: 40px; padding: 0 16px; border-radius: 20px; border: 0; font-weight: 700; font-size: 14px; }
.bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 14px calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
.bottom > * { pointer-events: auto; }
.hint { font-size: 13px; color: var(--ink-soft); text-align: center; text-shadow: 0 1px 6px rgba(0,0,0,0.7); pointer-events: none !important; }
.row { display: flex; gap: 10px; width: 100%; max-width: 480px; }
.btn { flex: 1; height: 52px; border-radius: 26px; border: 1.5px solid var(--line); background: var(--glass); color: var(--ink); font-weight: 700; font-size: 16px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.btn.primary { background: rgba(217,164,65,0.94); border-color: transparent; color: var(--wood); }
.counter { font-size: 36px; font-weight: 800; font-variant-numeric: tabular-nums; text-shadow: 0 2px 14px rgba(0,0,0,0.7); pointer-events: none !important; }
.ritual { width: 100%; max-width: 480px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; background: var(--glass); border-radius: 26px; padding: 8px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.ritual button { height: 68px; border: 0; border-radius: 18px; background: transparent; color: var(--ink); font-weight: 600; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
.ritual button.on { background: rgba(217,164,65,0.92); color: var(--wood); }
.ritual svg { width: 24px; height: 24px; }
.beadstrip { width: 100%; max-width: 480px; height: 64px; border-radius: 32px; background: var(--glass); position: relative; overflow: hidden; touch-action: none; }
.beadstrip canvas { width: 100%; height: 100%; display: block; }
.note { font-size: 11px; color: var(--ink-soft); opacity: 0.85; text-align: center; pointer-events: none !important; }
.tag { position: fixed; transform: translate(-50%, -100%); background: rgba(244,235,221,0.94); color: var(--brown); font-size: 12px; padding: 4px 9px; border-radius: 10px; pointer-events: none; white-space: nowrap; }
/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(10,6,5,0.45); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; background: var(--paper); color: var(--brown); border-radius: 28px 28px 0 0; padding: 12px 20px calc(env(safe-area-inset-bottom, 0px) + 22px); display: flex; flex-direction: column; gap: 14px; -webkit-user-select: auto; user-select: auto; }
.sheet.full { top: 0; max-height: none; border-radius: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 16px); }
.grab { width: 40px; height: 5px; border-radius: 3px; background: #CDBBA4; align-self: center; flex: none; }
.shead { display: flex; justify-content: space-between; align-items: center; }
.shead h2 { margin: 0; font-size: 24px; font-weight: 800; }
.pill { height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: var(--paper-2); color: var(--brown); font-weight: 700; font-size: 15px; }
.pill.gold { background: var(--gold); }
.pill.dark { background: var(--red); color: var(--paper); }
.card { background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.card .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.card .t b { font-size: 16px; }
.card .t span { font-size: 13px; color: var(--brown-soft); }
.label { font-size: 12px; font-weight: 700; color: var(--brown-soft); letter-spacing: 0.05em; text-transform: uppercase; }
.items { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.item { background: #FFFFFF; border: 2px solid transparent; border-radius: 20px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--brown); font-size: 13px; font-weight: 700; text-align: center; }
.item.sel { border-color: var(--gold); }
.item svg { width: 44px; height: 44px; }
.item .p { color: var(--red); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { height: 38px; padding: 0 14px; border-radius: 19px; border: 0; background: var(--paper-2); color: var(--brown); font-weight: 600; font-size: 14px; }
.chips button.sel { background: #3E5C66; color: var(--paper); }
.big { height: 56px; border-radius: 28px; border: 0; background: var(--red); color: var(--paper); font-size: 17px; font-weight: 700; flex: none; }
.streak { background: var(--red); color: var(--paper); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 4px; }
.streak b { font-size: 34px; }
.streak span { font-size: 13px; color: #EAD9C2; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stats div { background: #FFFFFF; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.stats b { font-size: 22px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 13px; color: var(--brown-soft); }
textarea { width: 100%; min-height: 90px; border: 0; border-radius: 16px; background: #FFFFFF; padding: 12px; font: 15px/1.45 var(--font); color: var(--brown); resize: none; -webkit-user-select: auto; user-select: auto; }
.list { background: #FFFFFF; border-radius: 20px; padding: 2px 16px; }
.list .card { padding: 12px 0; border-radius: 0; border-bottom: 1px solid #EFE5D6; }
.list .card:last-child { border-bottom: 0; }
.sw { width: 52px; height: 32px; border-radius: 16px; border: 0; background: #CDBBA4; position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; transition: left 0.15s; }
.sw[aria-checked="true"] { background: #3E5C66; }
.sw[aria-checked="true"]::after { left: 23px; }
.swatches { display: flex; gap: 10px; }
.swatches button { width: 40px; height: 40px; border-radius: 20px; border: 3px solid transparent; }
.swatches button.sel { border-color: var(--gold); }
input[type=text] { height: 40px; border: 0; border-radius: 12px; background: var(--paper-2); padding: 0 12px; font: 15px var(--font); color: var(--brown); width: 150px; -webkit-user-select: auto; user-select: auto; }
.link { background: none; border: 0; color: var(--red); font-weight: 600; font-size: 14px; align-self: center; padding: 10px; }
/* onboarding */
.ob { position: fixed; inset: 0; background: var(--paper); color: var(--brown); display: flex; flex-direction: column; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 80px) 28px calc(env(safe-area-inset-bottom, 0px) + 28px); gap: 14px; text-align: center; }
.ob h1 { margin: 24px 0 0; font-size: 28px; font-weight: 800; }
.ob p { margin: 0; font-size: 17px; line-height: 1.5; color: #5C4A42; max-width: 420px; }
.dots { margin-top: auto; display: flex; gap: 8px; }
.dots i { width: 8px; height: 8px; border-radius: 4px; background: #CDBBA4; }
.dots i.on { width: 22px; background: var(--red); }
.ob .big { width: 100%; max-width: 420px; }
@media (prefers-reduced-motion: reduce) { .sw::after { transition: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="top">
  <div class="chip serif" id="lunar">…<small id="lunar2"></small></div>
  <div class="icons">
    <div class="chip" id="streakChip">0</div>
    <button class="round" id="bJournal" aria-label="Journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></button>
    <button class="round" id="bSettings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
  </div>
</div>
<div class="banner" id="banner" hidden></div>
<div class="tag" id="tag" hidden></div>
<div class="toast" id="toast" hidden></div>

<div class="bottom" id="hallUI">
  <div class="hint" id="hint"></div>
  <div class="row"><button class="btn primary" id="bIncense"></button><button class="btn" id="bPond"></button></div>
  <div class="note" id="npcNote"></div>
</div>

<div class="bottom" id="sitUI" hidden>
  <div class="counter" id="count">0 / 108</div>
  <div class="hint" id="countLabel"></div>
  <div class="beadstrip" id="beadstrip" hidden><canvas id="beadc"></canvas></div>
  <div class="ritual">
    <button id="r-gassho"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v9M9 6l3-3 3 3M8 21c0-5 1-8 4-9 3 1 4 4 4 9"/></svg><span></span></button>
    <button id="r-bow" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="7" r="3"/><path d="M5 20h14M8 10c2 3 6 5 10 6"/></svg><span></span></button>
    <button id="r-beads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="4" r="1.6"/><circle cx="20" cy="12" r="1.6"/><circle cx="12" cy="20" r="1.6"/><circle cx="4" cy="12" r="1.6"/></svg><span></span></button>
    <button id="r-moktak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="11" cy="14" rx="8" ry="6"/><path d="M7 14h8M17 6l4-3"/></svg><span></span></button>
  </div>
  <div class="row"><button class="btn" id="bStand"></button></div>
</div>

<div class="bottom" id="pondUI" hidden>
  <div class="chip" id="lotusCount" style="pointer-events:none"></div>
  <div class="row"><button class="btn primary" id="bLantern"></button><button class="btn" id="bEnter"></button></div>
</div>

<div id="sheetWrap" hidden><div class="scrim" id="scrim"></div><div class="sheet" id="sheet"></div></div>
<div class="ob" id="ob" hidden></div>
<div id="fade" style="position:fixed;inset:0;background:#0A0605;opacity:0;pointer-events:none;transition:opacity .3s"></div>

<script src="three.min.js"></script>
<script src="lunar.js"></script>
<script src="i18n.js"></script>
<script src="figures.js"></script>
<script src="app.js"></script>
</body>
</html>
